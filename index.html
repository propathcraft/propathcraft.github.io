<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProPathCraft - Resume Services</title>
<style>
/* ===== General ===== */
body { font-family: Arial,sans-serif; margin:0; padding:0; background:#fdfdfd; color:#333; }
h1,h2,h3,p { margin:0 0 10px; }
a { text-decoration:none; }

/* ===== Topbar ===== */
.topbar {
  height:60px;
  background:#0a1f44;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  position:sticky;
  top:0;
  z-index:1003;
}

.brand { display:flex; align-items:center; gap:10px; }
.brand img { height:35px; width:auto; }
.brand-title { font-weight:700; font-size:18px; }
.slogan { font-size:12px; color:#d9e3f0; }
.hamburger { font-size:28px; cursor:pointer; display:none; }

/* ===== Sidebar ===== */
.sidebar {
  position:fixed;
  top:0; right:0;
  width:220px; height:100%;
  background:#141a24;
  padding-top:60px;
  transition:right 0.3s;
  z-index:1002;
}
.sidebar a {
  display:block;
  padding:12px 16px;
  margin:8px;
  color:#e6ecff;
  background:#1b2432;
  border-radius:8px;
  font-weight:600;
}
.sidebar a:hover{ background:#253147; }

/* ===== Main ===== */
main {
  padding:20px;
  margin-right:240px; /* space for sidebar */
  text-align:center;
}
.welcome-center { font-size:28px; font-weight:600; margin-top:50px; color:#0a1f44; }

/* ===== Slides ===== */
.slides {
  display:flex; gap:20px;
  overflow-x:auto; padding:20px 0;
  scroll-snap-type:x mandatory;
}
.slides::-webkit-scrollbar{display:none;}
.slide {
  flex:0 0 80%;
  max-width:300px;
  background:#fff;
  padding:16px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  scroll-snap-align:center;
  text-align:center;
  position:relative;
}
.slide img{width:100%; border-radius:8px; margin-bottom:8px;}
.slide h3{margin:8px 0;}
.slide .wa-btn {
  display:inline-block;
  background:#25D366;
  color:#fff;
  padding:8px 12px;
  border-radius:8px;
  font-weight:600;
  margin-top:10px;
  text-decoration:none;
}

/* ===== Responsive ===== */
@media(max-width:1023px){
  .sidebar{right:-220px;}
  .hamburger{display:block;}
  main{margin-right:0;}
  .slides{flex:0 0 auto;}
}
